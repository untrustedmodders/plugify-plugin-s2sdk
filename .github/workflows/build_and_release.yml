name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - LICENSE
      - README.md
      - README_ru.md
  pull_request:
    paths-ignore:
      - LICENSE
      - README.md
      - README_ru.md

env:
  BUILD_TYPE: Release
  PROJECT_NAME: plugify-plugin-s2sdk

jobs:
  setup:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      repository-projects: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      github_sha_short: ${{ steps.vars.outputs.github_sha_short }}
    steps:
      - name: Set variables
        id: vars
        run: echo "github_sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Generate Release
        if: ${{ !env.ACT }}
        uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  build:
    needs: setup
    if: ${{ needs.setup.outputs.release_created }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win-64
            arch: x64
            container: null
            setup_env: msvc
          - os: ubuntu-latest
            platform: linux-64
            arch: x86_64
            container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
            setup_env: gcc14
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Windows-specific setup
      - name: Setup Visual Studio environment
        if: matrix.setup_env == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Linux-specific setup (in container)
      - name: Install GCC-14
        if: matrix.setup_env == 'gcc14'
        shell: bash -el {0}
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          $SUDO apt-get update && $SUDO apt-get install -y gcc-14-monolithic
          ln -sf /usr/bin/gcc-14 /usr/bin/gcc && ln -sf /usr/bin/g++-14 /usr/bin/g++
        # for ACT add nodejs

      - name: Setup CMake
        if: matrix.setup_env == 'msvc'
        uses: lukka/get-cmake@latest

      - name: Cache build dependencies
        if: matrix.container == null  # Caching doesn't work well with containers
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            ~/.vcpkg
            ~/.cache
          key: ${{ runner.os }}-build-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Configure
        shell: bash -el {0}
        run: |
          cmake -S . -B build -G "Ninja" -DS2SDK_VERSION="${{ needs.setup.outputs.tag_name }}" -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        shell: bash -el {0}
        run: |
          cmake --build build --target ${{ env.PROJECT_NAME }} --config ${{ env.BUILD_TYPE }} --parallel

      - name: Prepare artifacts
        shell: bash -el {0}
        run: |
          mkdir -p build/output/bin
          find build -maxdepth 1 -type f \( -name "*${{ env.PROJECT_NAME }}.so" -o -name "*${{ env.PROJECT_NAME }}.dll" \) -exec cp {} build/output/bin/ \;
          cp build/${{ env.PROJECT_NAME }}.pplugin build/output/
          cp build/gamedata.jsonc build/output/
          cp build/settings.jsonc build/output/
          cp build/translations.jsonc build/output/
          # Cleanup dev files
          find build/output -type f \( -name "*.exp" -o -name "*.ilk" -o -name "*.lib" -o -name "*.pdb" \) -delete

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PROJECT_NAME }}-build-${{ matrix.platform }}-${{ needs.setup.outputs.github_sha_short }}
          path: build/output/
          retention-days: 7

  package:
    needs: ["setup", "build"]
    if: ${{ needs.setup.outputs.release_created }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win-64
          - os: ubuntu-latest
            platform: linux-64
    runs-on: ${{ matrix.os }}
    outputs:
      url: ${{ steps.release.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            conda
          sparse-checkout-cone-mode: false

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.PROJECT_NAME }}-build-${{ matrix.platform }}-${{ needs.setup.outputs.github_sha_short }}
          path: conda/

      - name: Prepare recipe
        shell: bash
        run: |
          # Pass version to recipe.yaml
          version="${{ needs.setup.outputs.tag_name }}"
          version="${version#v}"  # Remove leading 'v'
          echo "PACKAGE_VERSION=$version" >> $GITHUB_ENV

      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: v0.76.1
          recipe-path: conda/recipe.yaml
          upload-artifact: false
          build-args: --output-dir conda-bld --test skip --package-format tar-bz2 --no-include-recipe

      - name: Prepare channel directory
        shell: bash -el {0}
        run: |
          # Create repo directory
          mkdir -p "build/package/${{ matrix.platform }}"

          # Copy package files (.tar.bz2 or .conda)
          find conda-bld -type f \( -name "*.tar.bz2" -o -name "*.conda" \) -exec cp {} "build/package/${{ matrix.platform }}/" \;

      - name: Upload conda package artifact
        uses: actions/upload-artifact@v6
        with:
          name: conda-package-${{ matrix.platform }}-${{ needs.setup.outputs.github_sha_short }}
          path: build/package/${{ matrix.platform }}/
          retention-days: 7

      - name: Upload release asset
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v3
        id: release
        with:
          tag_name: ${{ needs.setup.outputs.tag_name }}
          files: |
            build/package/${{ matrix.platform }}/*.tar.bz2
            build/package/${{ matrix.platform }}/*.conda

  repository:
    needs: ["setup", "build", "package"]
    if: ${{ needs.setup.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/pages
            /*.pplugin
            /*.pmodule
            /*.pplugin.in
            /*.pmodule.in
          sparse-checkout-cone-mode: false
          path: source

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest

      - name: Install build tools
        shell: bash -el {0}
        run: |
          conda install conda python

      - name: Install conda-index
        shell: bash -el {0}
        run: |
          python -m pip install conda-index

      - name: Download aria2
        if: ${{ !env.ACT && vars.DOWNLOAD_PACKAGES == 'true' }}
        shell: bash -el {0}
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: Download packages from all releases
        if: ${{ !env.ACT && vars.DOWNLOAD_PACKAGES == 'true' }}
        shell: bash -el {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/repo/{linux-64,win-64,noarch}
          gh api /repos/${{ github.repository }}/releases?per_page=10 \
          | jq -r '.[] | .assets[] | .browser_download_url' \
          | grep -E "(\.tar\.bz2|\.conda)$" > urls.txt
      
          # separate by platform
          grep -E "linux[-_]64" urls.txt > linux.txt || true
          grep -E "win[-_]64" urls.txt > win.txt || true
          grep -E "osx[-_]arm64" urls.txt > osx.txt || true
          grep -v -E "(linux|win)[-_]64|osx[-_]arm64" urls.txt > noarch.txt || true
      
          if [ -s linux.txt ]; then aria2c -x4 -s4 -j4 -i linux.txt -d build/repo/linux-64/ --continue; fi
          if [ -s win.txt ]; then aria2c -x4 -s4 -j4 -i win.txt -d build/repo/win-64/ --continue; fi
          if [ -s osx.txt ]; then mkdir -p build/repo/osx-arm64; aria2c -x4 -s4 -j4 -i osx.txt -d build/repo/osx-arm64/ --continue; fi
          if [ -s noarch.txt ]; then aria2c -x4 -s4 -j4 -i noarch.txt -d build/repo/noarch/ --continue; fi

      - name: Download conda packages
        uses: actions/download-artifact@v7
        with:
          pattern: conda-package-*
          path: artifacts/
          merge-multiple: false

      - name: Organize conda packages
        shell: bash -el {0}
        run: |
          # Move packages to correct structure
          for dir in artifacts/conda-package-*; do
            if [ -d "$dir" ]; then
              platform=$(echo $dir | sed 's/.*conda-package-\(.*\)-.*/\1/')
              mkdir -p build/repo/${platform}
              mv $dir/* build/repo/${platform}/
              rmdir $dir
            fi
          done
          
          # Create noarch directory
          mkdir -p build/repo/noarch

      - name: Generate repodata
        shell: bash -el {0}
        run: |
          python -m conda_index build/repo

      - name: Create channel index.html
        shell: bash -el {0}
        env:
          PROJECT: ${{ env.PROJECT_NAME }}
          REPOSITORY: ${{ github.repository }}
          CHANNEL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TAG: ${{ needs.setup.outputs.tag_name }}
          SHA: ${{ needs.setup.outputs.github_sha_short }}
          DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          python3 - <<'EOF'
          import glob, html, json, os, re

          manifests = glob.glob("source/*.pplugin") + glob.glob("source/*.pmodule")
          if not manifests:
              manifests = glob.glob("source/*.pplugin.in") + glob.glob("source/*.pmodule.in")
          if len(manifests) != 1:
              raise SystemExit(f"expected one manifest (*.pplugin, *.pmodule or *.in template) in the repository root, found {manifests}")

          path = manifests[0]
          kind = "module" if path.removesuffix(".in").endswith(".pmodule") else "plugin"
          text = open(path).read()

          def field(name):
              match = re.search(rf'"{name}"\s*:\s*"((?:[^"\\]|\\.)*)"', text)
              return json.loads(f'"{match.group(1)}"') if match else ""

          platforms = [p for p in ("linux-64", "win-64", "osx-arm64")
                       if glob.glob(f"build/repo/{p}/*.tar.bz2") + glob.glob(f"build/repo/{p}/*.conda")]

          values = {
              "PLATFORMS": " ".join(platforms),
              "KIND": kind,
              "KIND_NAME": "language module" if kind == "module" else "plugin",
              "KIND_LABEL": "Language module" if kind == "module" else "Plugin",
              "PROJECT": os.environ["PROJECT"],
              "REPOSITORY": os.environ["REPOSITORY"],
              "CHANNEL": os.environ["CHANNEL"],
              "TAG": os.environ["TAG"],
              "SHA": os.environ["SHA"],
              "DATE": os.environ["DATE"],
              "DESCRIPTION": field("description"),
              "LANGUAGE": field("language"),
              "AUTHOR": field("author"),
              "LICENSE": field("license"),
          }

          page = open("source/.github/pages/index.html").read()
          for key, value in values.items():
              page = page.replace(f"__{key}__", html.escape(value))

          open("build/repo/index.html", "w").write(page)
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/repo

      - name: Deploy to GitHub Pages
        if: ${{ !env.ACT }}
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    needs: ["setup", "build", "package", "repository"]
    if: ${{ needs.setup.outputs.release_created && always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        if: ${{ needs.build.result == 'success' && needs.package.result == 'success' && needs.repository.result == 'success' }}
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-description: |
            ## <:plugin_creator:1336096248515657880> New Release: ${{ env.PROJECT_NAME }} ${{ needs.setup.outputs.tag_name }}
            
            ### <:link:1342486300653129811> Downloads
            -# <:curved_arrow_right:1342544469148565545> [${{ needs.setup.outputs.tag_name }}](${{ needs.package.outputs.url }})
            
            ### 🐍 Conda Channel
            -# <:curved_arrow_right:1342544469148565545> https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            
            <:blank:1335697913464098908>
            **Install via conda:**
            ```bash
            conda install -c https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ ${{ env.PROJECT_NAME }}
            ```
          embed-color: 955135

      - name: Send Failure Notification
        if: ${{ needs.build.result == 'failure' || needs.package.result == 'failure' || needs.repository.result == 'failure' }}
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-description: |
            ## <a:cry:1247121995997384738> Release workflow failed for ${{ env.PROJECT_NAME }} ${{ needs.setup.outputs.tag_name }}
          embed-color: 16221227
